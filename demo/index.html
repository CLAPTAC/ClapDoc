<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>doc-editor demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      max-width: 720px;
      margin: 40px auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0 16px;
    }
    h1 { font-size: 1.1em; color: #666; }
    doc-editor {
      display: block;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
      min-height: 300px;
      /* Force a readable light demo surface even when the OS is in dark mode */
      color-scheme: light;
      --de-fg: #1a1a1a;
      --de-bg: #ffffff;
      --de-menu-bg: #ffffff;
      --de-menu-fg: #1a1a1a;
      --de-accent: #2563eb;
      background: #fff;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      overflow: auto;
      max-height: 240px;
      font-size: 12px;
    }
    button {
      margin: 12px 8px 12px 0;
      padding: 6px 14px;
      cursor: pointer;
    }
    .hint { color: #888; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>&lt;doc-editor&gt; — controllable block editor</h1>
  <p class="hint">Hover a block for ⠿ drag and + add. Use ⋯ for move/settings/delete. Type <kbd>/</kbd> on an empty line for blocks. Undo with Ctrl/Cmd+Z.</p>

  <doc-editor placeholder="Start writing… Type / for blocks" inline-toolbar autofocus></doc-editor>

  <button id="save">Save (log JSON)</button>
  <button id="markdown">Export as Markdown</button>
  <button id="undo">Undo</button>
  <button id="redo">Redo</button>
  <button id="readonly">Toggle read-only</button>
  <button id="clear">Clear</button>

  <pre id="output"></pre>

  <script src="../dist/doc-editor.global.js"></script>
  <script>
    const el = document.querySelector('doc-editor')
    const output = document.getElementById('output')
    let ro = false

    el.tunes = { alignment: DocEditor.AlignmentTune }

    el.addEventListener('change', (e) => {
      console.log('change', e.detail)
    })
    el.addEventListener('ready', () => console.log('ready'))
    el.addEventListener('block-added', (e) => console.log('block-added', e.detail))

    document.getElementById('save').addEventListener('click', async () => {
      const data = await el.save()
      output.textContent = JSON.stringify(data, null, 2)
    })

    document.getElementById('markdown').addEventListener('click', async () => {
      const data = await el.save()
      output.textContent = DocEditor.blocksToMarkdown(data)
    })

    document.getElementById('undo').addEventListener('click', () => el.undo())
    document.getElementById('redo').addEventListener('click', () => el.redo())
    document.getElementById('clear').addEventListener('click', () => el.clear())
    document.getElementById('readonly').addEventListener('click', () => {
      ro = !ro
      el.setReadOnly(ro)
    })
  </script>
</body>
</html>
